name: CI

# Runs both packages' tests and typecheck on every push/PR -- a monorepo-specific need: a change
# to packages/papyrus (its public src/index.ts exports) can silently break packages/pi-papyrus
# without this, since the two are only ever exercised together here, not in either package's own
# publish workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check:ci
      - run: bun run --filter '*' test
      - run: bun run --filter '*' typecheck
